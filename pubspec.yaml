name: jarz_pos
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.9.0
  flutter_dotenv: ^6.0.0
  flutter_secure_storage: ^9.2.4
  web_socket_channel: ^3.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  socket_io_client: ^3.1.2
  # >=4.14.0 constrains firebase_core_web to >=3.11.0, which carries the two
  # WebKit fixes we need. 3.2.0 loads every component bundle with concurrent
  # dynamic imports, and they race on the shared firebase-app.js module; on
  # WebKit the returned namespace can still be in the temporal dead zone, so
  # `firebase.app()` reports an app exists while the handle is null and
  # initializeApp throws a null check. It also matched Blink's "of undefined"
  # wording when swallowing an error, so WebKit's "undefined is not an object"
  # rethrew instead. Together that killed Firebase init on Chrome/iOS only,
  # which the app catches and continues past -- so iPhone staff on the web
  # build silently got no push at all. flutterfire#18436.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.0.3
  shared_preferences: ^2.3.2
  file_picker: ^8.1.4
  collection: ^1.18.0
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_blue_plus: ^2.0.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.2.0
  sentry_flutter: ^9.7.0
  web: ^1.1.1

  # About page dependencies
  package_info_plus: ^9.0.1
  shorebird_code_push: ^2.0.0

  # Charts for analytics dashboards
  fl_chart: ^0.69.0
  geolocator: ^14.0.2

  # Lead contacts: the OS contact picker (ACTION_PICK / CNContactPickerViewController).
  # Deliberately NOT a contacts-reading package — the picker runs out of process,
  # so the app never needs the READ_CONTACTS permission and only ever receives
  # the one person the rep tapped. Android/iOS only; guarded on web.
  flutter_native_contact_picker: ^0.0.11

  # Receipt sharing: hands the rendered receipt PNG to the OS share sheet
  # (WhatsApp, Messenger, Gmail...). wa.me can carry text but never a file, so
  # the direct "Send via WhatsApp" action stays a url_launcher deep link and
  # this is the only way the customer gets the receipt as an image.
  share_plus: ^12.0.2
  # Chat inbox voice notes: inline playback (ExoPlayer on Android plays the
  # WhatsApp ogg/opus notes; the browser audio element on web).
  just_audio: ^0.10.6
  # The voice-note player writes the fetched (session-authenticated) bytes to
  # a temp file on Android/iOS. Already in the tree via just_audio.
  path_provider: ^2.1.5
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.14
  riverpod_generator: 2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - .env.local
    - .env.staging
    - .env.prod
    - assets/images/logo.png
    - assets/fonts/
    - assets/studio/fixtures/
    - shorebird.yaml

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/logo.png

# Native splash screen configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"
  web: false

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
